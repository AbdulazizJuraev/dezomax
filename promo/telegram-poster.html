<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; background: #07090f; font-family: Inter, sans-serif; color: #fff; overflow: hidden; position: relative; }
  .wall { position: absolute; inset: -40px -60px auto -60px; height: 860px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; transform: rotate(-6deg); opacity: .55; }
  .wall img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,9,15,.25) 0%, rgba(7,9,15,.55) 38%, #07090f 62%); }
  .glow { position: absolute; width: 900px; height: 900px; left: 90px; top: 520px; background: radial-gradient(circle, rgba(14,165,233,.28), transparent 60%); }
  .content { position: absolute; left: 70px; right: 70px; top: 470px; }
  .logo { height: 78px; display: block; margin-bottom: 34px; }
  h1 { font-family: Oswald, sans-serif; font-size: 92px; line-height: 1; text-transform: uppercase; letter-spacing: .5px; }
  h1 em { font-style: normal; color: #22b8f5; }
  .sub { margin-top: 22px; font-size: 34px; font-weight: 500; color: #c9d4e3; line-height: 1.35; }
  .chips { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { padding: 14px 24px; border-radius: 999px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); font-size: 28px; font-weight: 700; }
  .cta { position: absolute; left: 70px; right: 70px; bottom: 70px; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 30px 38px; border-radius: 28px; background: linear-gradient(90deg, #0ea5e9, #2563eb); box-shadow: 0 20px 60px rgba(14,165,233,.35); }
  .cta b { display: block; font-size: 30px; font-weight: 800; opacity: .9; }
  .cta span { display: block; font-family: Oswald, sans-serif; font-size: 66px; font-weight: 700; letter-spacing: .5px; }
  .tg { width: 120px; height: 120px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .tg svg { width: 72px; height: 72px; margin-left: -6px; }
</style></head>
<body>
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div class="glow"></div>
  <div class="content">
    <img class="logo" src="../images/logo/logo.png" alt="DezoMax">
    <h1>Kinolar endi <em>bepul</em><br>va o‘zbek tilida</h1>
    <p class="sub">Har kuni yangi kinolar, seriallar va multfilmlar — telefon, kompyuter va televizorda.</p>
    <div class="chips"><span class="chip">🎬 O‘zbek kinolari</span><span class="chip">📺 Seriallar</span><span class="chip">🧸 Multfilmlar</span><span class="chip">🎞 Kino klassikasi</span></div>
  </div>
  <div class="cta">
    <div><b>Kanalga qo‘shiling 👇</b><span>t.me/dezomaxuz</span></div>
    <div class="tg"><svg viewBox="0 0 24 24" fill="#229ED9"><path d="M21.9 4.3 18.6 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.5l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.5 3c.9-.3 1.7.2 1.4 1.3z"/></svg></div>
  </div>
<script>
  const posters = ['101-reys','18-kvadrat','afv','bir-uyda-sevishganlar','borilar-2-quvgin','borilar','dadam-bilmasin','daxshatli-uy','ichkuyov','janob-hech-kim','jasur','konsert-avaz-2014'];
  const all = [...posters, ...posters.slice().reverse(), ...posters.slice(3), ...posters.slice(0, 3)];
  document.getElementById('wall').innerHTML = all.slice(0, 25).map(p => `<img src="../images/uz/${p}.jpg" alt="">`).join('');
</script>
</body></html>
