// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Kotlin plaginlar (masalan @capacitor/background-runner) Java kodini 21-versiyaga kompilyatsiya qiladi,
// Android Studio'dagi JDK 25 esa Kotlin'ni 24 ga — «Inconsistent JVM Target» xatosi chiqmasin deb Kotlin ham 21 ga
subprojects {
    plugins.withId('org.jetbrains.kotlin.android') {
        tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach { t ->
            def target = t.compilerOptions.jvmTarget
            target.set(target.get().class.fromTarget('21'))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
