# RuTube'dan avtomatik kino va multfilm importi — har kuni (tools/rutube-import.js).
# Rasmiy studiya kanallari (data/rutube-sources.json, rights: owner) — tekshiruvdan o'tgan videolar saytga o'zi chiqadi;
# huquqi noma'lumlar — admin → «RuTube» navbatiga. Ishlamay qolgan videolar qayta tekshiriladi va saytdan olinadi.
# GitHub token bilan qilingan push boshqa workflow'ni ishga tushirmaydi — shuning uchun dezomax.uz (cf-site) qo'lda chaqiriladi.
name: rutube-import

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'   # har kuni 06:17 (Toshkent)

permissions:
  contents: write
  actions: write

concurrency:
  group: rutube-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RuTube'dan qidirish, tekshirish, qo'shish
        run: node tools/rutube-import.js --max-new=800 --recheck=400

      - name: Sahifalar, sitemap, versiyalar
        run: node tools/bump-version.js

      - name: Saytni tekshirish (JS, ma'lumot)
        run: node tools/check-site.js

      - name: Saqlash
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js data kino toplam marvel sitemap.xml ./*.html
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; echo "O'zgarish yo'q"; exit 0; fi
          MSG=$(node -e "const t=require('./data/rutube-report.json').totals;console.log('RuTube avto-import: +'+t.published+' film/multfilm, '+t.attached+' biriktirildi, '+t.queued+' navbatga, '+t.removedBroken+' ishlamaydigan olindi')")
          git commit -q -m "$MSG"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: dezomax.uz ga joylash
        if: steps.save.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cf-site.yml --ref main
