# dezomax.uz saytini Cloudflare'ga yuklash (Workers static assets, bepul): har push'da sayt fayllari
# cloudflare/site/worker.js bilan birga yuklanadi. Ketma-ket push'lar bittaga birlashadi (cancel-in-progress).
# Kerak: repo secrets CLOUDFLARE_API_TOKEN («Edit Cloudflare Workers» shabloni) va CLOUDFLARE_ACCOUNT_ID.
# Ular qo'yilmagan bo'lsa — hech narsa qilmaydi.
name: cf-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cf-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kalitlar bormi
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "ok=$([ -n "$T" ] && [ -n "$A" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'

      # faqat saytga kerakli fayllar (ilova, server, admin, vositalar — yo'q)
      - name: Sayt fayllarini yig'ish
        if: steps.chk.outputs.ok == '1'
        run: |
          mkdir -p _site
          git ls-files -z \
            | grep -zvE '^(mobile|desktop|tools|server|cloudflare|tv|\.github)/|(^|/)README|\.md$|^guard-result|^\.|^admin\.html$|^admin\.webmanifest$|^js/admin\.js$|^js/data-lib2?\.js$' \
            | xargs -0 cp --parents -t _site
          cp cloudflare/site/_headers _site/_headers
          echo "fayllar: $(find _site -type f | wc -l), hajm: $(du -sh _site | cut -f1)"

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: 20

      - name: Cloudflare'ga yuklash
        if: steps.chk.outputs.ok == '1'
        working-directory: cloudflare/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
