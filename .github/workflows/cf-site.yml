# dezomax.uz saytini Cloudflare'ga yuklash (Workers static assets, bepul): har push'da sayt fayllari
# cloudflare/site/worker.js bilan birga yuklanadi. Ketma-ket push'lar bittaga birlashadi (cancel-in-progress).
# Kerak: repo secrets CLOUDFLARE_API_TOKEN («Edit Cloudflare Workers» shabloni) va CLOUDFLARE_ACCOUNT_ID.
# Ular qo'yilmagan bo'lsa — hech narsa qilmaydi.
name: cf-site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: cf-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kalitlar bormi
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "ok=$([ -n "$T" ] && [ -n "$A" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'

      # faqat saytga kerakli fayllar (ilova, server, admin, vositalar — yo'q)
      - name: Sayt fayllarini yig'ish
        if: steps.chk.outputs.ok == '1'
        run: |
          node tools/gen-site-data.js   # Telegram avto-yuklash faqat data-custom.js yozadi — sayt ro'yxati shu yerda yangilanadi
          node tools/gen-home-data.js   # bosh sahifa ro'yxati admin o'zgarishlari bilan yangi bo'lsin
          mkdir -p _site
          git ls-files -z \
            | grep -zvE '^(mobile|desktop|tools|server|cloudflare|tv|\.github)/|(^|/)README|\.md$|^guard-result|^\.|^admin\.html$|^admin\.webmanifest$|^js/admin\.js$|^js/data-lib2?\.js$' \
            | xargs -0 cp --parents -t _site
          cp cloudflare/site/_headers _site/_headers
          echo "fayllar: $(find _site -type f | wc -l), hajm: $(du -sh _site | cut -f1)"

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: 20

      # Barqarorlik: sayt tekshiruvidan o'tmasa — dezomax.uz ga YUKLANMAYDI, oxirgi ishlagan versiya qoladi (tools/check-site.js):
      # kod sintaksisi, kinolar ma'lumoti, sahifalardagi fayllar va haqiqiy Chrome'da 9 ta asosiy sahifa (JS xatosi, kartalar, pleyer)
      - name: Saytni tekshirish
        if: steps.chk.outputs.ok == '1'
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core@23 > /dev/null
          node tools/check-site.js --smoke

      - name: Tekshiruvdan o'tmadi — xabar (GitHub Issues)
        if: failure() && steps.chk.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}"             --title "Sayt tekshiruvidan o'tmadi — dezomax.uz yangilanmadi"             --body "Oxirgi o'zgarish (${{ github.sha }}) tekshiruvdan o'tmadi, shuning uchun dezomax.uz da oldingi ishlagan versiya qoldi. Xato ro'yxati: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Cloudflare'ga yuklash
        if: steps.chk.outputs.ok == '1'
        working-directory: cloudflare/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
