# Telegram kanalga (@dezomaxuz) kuniga 3 marta avtomatik post: yangi kinolar, ular tugasa — saytdagi boshqalar (tools/tg-post.js).
# Kerak: repo secret TG_BOT_TOKEN (BotFather'dan), bot kanalda admin bo'lishi kerak. Secret bo'lmasa — hech narsa yubormaydi.
name: tg-post

on:
  workflow_dispatch:
    inputs:
      setup:
        description: "Kanal tavsifi va suratini o‘rnatish"
        type: boolean
        default: false
      promo:
        description: "Reklama afishasini kanalga yuborish"
        type: boolean
        default: false
      count:
        description: "Nechta post (sinov uchun 1)"
        type: string
        default: "5"
      refresh:
        description: "Kanaldagi eski postlarni yangi ko‘rinishga o‘tkazish (bir martalik)"
        type: boolean
        default: false
  schedule:
    # 17:17, 19:17, 21:17 (Toshkent) — odamlar kechqurun ko'p kiradi (2026-11-28). Soat boshi (:00) emas:
    # GitHub o'sha paytda band bo'lib, ishlarni soatlab kechiktirardi (postlar tungi 4-5 da chiqardi)
    - cron: '17 12,14,16 * * *'

permissions:
  contents: write

concurrency:
  group: tg-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kanal tavsifi va surati
        if: inputs.setup
        env:
          TG_BOT_TOKEN: ${{ secrets.DEZOUSERS || secrets.TG_BOT_TOKEN }}
        run: node tools/tg-channel-setup.js

      - name: Reklama afishasi
        if: inputs.promo
        env:
          TG_BOT_TOKEN: ${{ secrets.DEZOUSERS || secrets.TG_BOT_TOKEN }}
        run: node tools/tg-promo.js

      # saytdagi WebP posterlar JPEG'ga o'giriladi (tg-post.js webpToJpeg) — Pillow
      - name: Pillow
        if: ${{ !inputs.setup && !inputs.promo && !inputs.refresh }}
        run: python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq > /dev/null; sudo apt-get install -y -qq python3-pil > /dev/null) || true

      - name: Kanalga post
        if: ${{ !inputs.setup && !inputs.promo && !inputs.refresh }}
        env:
          TG_BOT_TOKEN: ${{ secrets.DEZOUSERS || secrets.TG_BOT_TOKEN }}
          COUNT: ${{ inputs.count || '5' }}
        run: node tools/tg-post.js --count="$COUNT"

      - name: Eski postlarni yangilash
        if: inputs.refresh
        env:
          TG_BOT_TOKEN: ${{ secrets.DEZOUSERS || secrets.TG_BOT_TOKEN }}
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq > /dev/null; sudo apt-get install -y -qq python3-pil > /dev/null) || true
          node tools/tg-refresh.js --media=456,457

      - name: Holatni saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tg-posted.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Telegram kanalga post"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
