<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahifa topilmadi — DezoMax</title>
<link rel="icon" type="image/png" href="/dezomax/images/logo/standart.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dezomax/css/style.css?v=202609241529">
<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    padding: 40px 24px;
    gap: 6px;
  }
  .nf-code {
    font-size: clamp(72px, 16vw, 150px);
    font-weight: 800;
    letter-spacing: -.05em;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .nf h1 { margin: 10px 0 8px; font-size: clamp(20px, 3vw, 28px); font-weight: 700; letter-spacing: -.03em; }
  .nf p { margin: 0 0 26px; color: var(--text-dim); font-size: 15px; max-width: 420px; }
  .nf .btn { text-decoration: none; }
</style>
</head>
<body>

<main class="nf">
  <a class="logo" href="/dezomax/" style="margin-bottom:22px">
    <img class="logo-img" src="/dezomax/images/logo/logo.png" alt="DezoMax" width="178" height="34">
  </a>

  <div class="nf-code">404</div>
  <h1 id="nfTitle">Sahifa topilmadi</h1>
  <p id="nfText">Siz qidirgan sahifa mavjud emas yoki ko‘chirilgan. Bosh sahifaga qaytib, kerakli kinoni qidirib ko‘ring.</p>

  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a class="btn btn-primary" href="/dezomax/" id="nfHome">Bosh sahifa</a>
    <a class="btn btn-ghost" href="/dezomax/catalog.html" id="nfCatalog">Katalog</a>
  </div>
</main>

<script>
  // Foydalanuvchi tanlagan tilni qo'llaymiz (i18n.js bu sahifada yuklanmaydi)
  var T = {
    uz: { title: 'Sahifa topilmadi',
          text: 'Siz qidirgan sahifa mavjud emas yoki ko‘chirilgan. Bosh sahifaga qaytib, kerakli kinoni qidirib ko‘ring.',
          home: 'Bosh sahifa', catalog: 'Katalog' },
    ru: { title: 'Страница не найдена',
          text: 'Запрошенная страница не существует или была перемещена. Вернитесь на главную и найдите нужный фильм.',
          home: 'Главная', catalog: 'Каталог' }
  };
  try {
    var lang = localStorage.getItem('dezomax_lang') === 'ru' ? 'ru' : 'uz';
    document.documentElement.lang = lang;
    document.getElementById('nfTitle').textContent = T[lang].title;
    document.getElementById('nfText').textContent = T[lang].text;
    document.getElementById('nfHome').textContent = T[lang].home;
    document.getElementById('nfCatalog').textContent = T[lang].catalog;
  } catch (e) { /* localStorage yopiq bo'lsa — o'zbekcha qoladi */ }
</script>
</body>
</html>
